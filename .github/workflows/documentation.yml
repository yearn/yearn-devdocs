name: Documentation Workflow

on: [push, pull_request]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test address-check pipeline
        run: bun run test:addresses

      - name: Check addresses and build
        id: build
        run: |
          rm -f scripts/fetchedAddressData.json all_checks_passed.txt issue_body.md
          bun run build

      - name: Report address-check result
        if: steps.build.outcome == 'success'
        run: |
          if [ "$(cat all_checks_passed.txt)" != 'true' ]; then
            cat issue_body.md
            echo '::error::Address validation found mismatches. The site contains the fresh warning report.'
            exit 1
          fi

      - name: Save address-check report
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: address-check-report
          path: |
            scripts/fetchedAddressData.json
            all_checks_passed.txt
            issue_body.md
          retention-days: 30
          if-no-files-found: warn
