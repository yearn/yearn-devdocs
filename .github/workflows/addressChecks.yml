name: Address Checks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run address checks
        id: checks
        continue-on-error: true
        run: |
          rm -f scripts/fetchedAddressData.json all_checks_passed.txt issue_body.md
          bun run runAddressCheck

      - name: Save address-check report
        if: ${{ !cancelled() && (steps.checks.outcome == 'success' || steps.checks.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: address-check-report
          path: |
            scripts/fetchedAddressData.json
            all_checks_passed.txt
            issue_body.md
          retention-days: 30
          if-no-files-found: warn

      - name: Create an issue if completed checks found mismatches
        if: ${{ !cancelled() && steps.checks.outcome == 'failure' && hashFiles('issue_body.md') != '' }}
        run: |
          curl --fail-with-body -H "Authorization: Bearer ${{ secrets.ADDRESS_CHECKS }}" \
          -H "Content-Type: application/json" \
          -d "$(jq -n --arg title ':robot: Address Checks Failed' --arg body "$(cat issue_body.md)" '{title: $title, body: $body}')" \
          https://api.github.com/repos/yearn/yearn-devdocs/issues

      - name: Fail the job if checks failed or could not complete
        if: ${{ !cancelled() && steps.checks.outcome == 'failure' }}
        run: exit 1
